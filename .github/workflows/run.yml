name: Run WFM Script (Immediate Test)

on:
  push:                     # 每次有 commit/push 到 main 分支就會觸發
    branches:
      - main
  workflow_dispatch:        # 允許手動觸發

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4   # 建議升級到 v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug current time
        run: |
          echo "Triggered at (UTC): $(date -u)"
          echo "Triggered at (Local/Taiwan): $(date)"

      - name: Run script
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python WFM_Searcher.py
